<div class="container mt-4">

  <h3>{{ isEditMode ? 'Edit Campaign' : 'Create Campaign' }}</h3>

  <form [formGroup]="campaignForm" novalidate (ngSubmit)="onSubmit($event)">

    <!-- BASIC -->
    <div class="card p-3 mb-3">
      <h5>Basic Info</h5>

      <div class="row">
        <div class="col-md-6">
          <label for="camp_name">Campaign Name</label>
          <input id="camp_name" class="form-control mb-2" placeholder="Campaign Name"
                 formControlName="camp_name">
        </div>

        <div class="col-md-6">
          <label for="destination_url">Destination URL</label>
          <input id="destination_url" class="form-control mb-2" placeholder="Destination URL"
                 formControlName="destination_url">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label for="schedule_start">Start Date</label>
          <input id="schedule_start" type="date" class="form-control mb-2"
                 formControlName="schedule_start">
        </div>

        <div class="col-md-6">
          <label for="schedule_end">End Date</label>
          <input id="schedule_end" type="date" class="form-control"
                 formControlName="schedule_end">
        </div>
      </div>
    </div>

    <!-- ALLOW TRAFFIC -->
    <div class="card p-3 mb-3" formGroupName="allow_traffic">
      <h5>Allow Traffic</h5>

      <div class="row">
        <div class="col-md-6">
          <label for="allow_vertical">Vertical</label>
          <select id="allow_vertical" class="form-control mb-2" formControlName="vartical">
            <option value="">Select Vertical</option>
            <option *ngFor="let v of verticalList" [value]="v">{{ v }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="allow_provider">Provider</label>
          <app-multiselected
            [dropdownData]="providerList"
            [selectedData]="campaignForm.get('allow_traffic.provider')?.value"
            [dropdownPlaceholder]="'Select Provider'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onAllowProviderChange($event)">
          </app-multiselected>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label>Country</label>
          <app-multiselected
            [dropdownData]="displayCountryList"
            [selectedData]="campaignForm.get('allow_traffic.country')?.value"
            [dropdownPlaceholder]="'Select Country'"
            [dropdownSettings]="countryDropdownSettings"
            (getSelectedItems)="onAllowCountryChange($event)">
          </app-multiselected>
        </div>
        <div class="col-md-6">
          <label>Device</label>
          <app-multiselected
            [dropdownData]="allow_deviceList"
            [selectedData]="campaignForm.get('allow_traffic.device')?.value"
            [dropdownPlaceholder]="'Select Device'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onAllowDeviceChange($event)">
          </app-multiselected>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label>OS</label>
          <app-multiselected
            [dropdownData]="Allow_osList"
            [selectedData]="campaignForm.get('allow_traffic.os')?.value"
            [dropdownPlaceholder]="'Select OS'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onAllowOsChange($event)">
          </app-multiselected>
        </div>
        <div class="col-md-6 mt-2">
          <label for="allow_tag">Tag (keep empty for all tags)</label>
          <app-multiselected
            [dropdownData]="tagList"
            [selectedData]="campaignForm.get('allow_traffic.tag')?.value"
            [dropdownPlaceholder]="'Select Tag'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onAllowTagChange($event)">
          </app-multiselected>
        </div>
      </div>
    </div>

    <!-- BLOCKED TRAFFIC -->
    <div class="card p-3 mb-3" formGroupName="blocked_traffic">
      <h5>Blocked Traffic</h5>

      <div class="row">
        <div class="col-md-6">
          <label for="blocked_provider">Provider</label>
          <app-multiselected
            [dropdownData]="providerList"
            [selectedData]="campaignForm.get('blocked_traffic.provider')?.value"
            [dropdownPlaceholder]="'Select Provider'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onBlockedProviderChange($event)">
          </app-multiselected>
        </div>
        <div class="col-md-6">
          <label for="blocked_country">Country</label>
          <app-multiselected
            [dropdownData]="displayCountryList"
            [selectedData]="campaignForm.get('blocked_traffic.country')?.value"
            [dropdownPlaceholder]="'Select Country'"
            [dropdownSettings]="countryDropdownSettings"
            (getSelectedItems)="onBlockedCountryChange($event)">
          </app-multiselected>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label for="blocked_device">Device</label>
          <app-multiselected
            [dropdownData]="Block_deviceList"
            [selectedData]="campaignForm.get('blocked_traffic.device')?.value"
            [dropdownPlaceholder]="'Select Device'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onBlockedDeviceChange($event)">
          </app-multiselected>
        </div>
        <div class="col-md-6">
          <label for="blocked_os">OS</label>
          <app-multiselected
            [dropdownData]="Block_osList"
            [selectedData]="campaignForm.get('blocked_traffic.os')?.value"
            [dropdownPlaceholder]="'Select OS'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onBlockedOsChange($event)">
          </app-multiselected>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mt-2">
          <label for="blocked_tag">Tag (keep empty for all tags)</label>
          <app-multiselected
            [dropdownData]="tagList"
            [selectedData]="campaignForm.get('blocked_traffic.tag')?.value"
            [dropdownPlaceholder]="'Select Tag'"
            [dropdownSettings]="dropdownSettings"
            (getSelectedItems)="onBlockedTagChange($event)">
          </app-multiselected>
        </div>
      </div>
    </div>

    <!-- BUDGET -->
<div class="card budget-card p-4 mb-3" formGroupName="budget">

  <!-- Header -->
  <div class="budget-header">
    <h5 class="mb-0">Budget Settings</h5>

    <div class="target-badge">
      Total Funds:
      ${{ campaignForm.get('target')?.value || 0 | number:'1.2-2' }}
    </div>
  </div>

  <!-- Top Row -->
  <div class="row g-3 align-items-end">

    <!-- CPC -->
    <div class="col-md-2">
      <label class="form-label">CPC</label>

      <div class="cpc-box">
        ${{ campaignForm.get('budget.cpc')?.value || 0 | number:'1.2-2' }}
      </div>
    </div>

    <!-- Clicks -->
    <div class="col-md-6">
      <label class="form-label">Select Clicks</label>

      <select class="form-control custom-input" (change)="onSelect($event)">
        <option value="">Select Clicks</option>

        <option
          *ngFor="let item of clickListItems"
          [value]="item.clicks + '-' + item.target"
          [selected]="item.clicks === campaignForm.value.clicks"
        >
          {{ item.clicks }} Clicks
        </option>
      </select>
    </div>

    <!-- Daily Budget -->
    <div class="col-md-4">
      <label class="form-label">Daily Budget</label>

      <input
        type="number"
        class="form-control custom-input"
        placeholder="Enter Daily Budget"
        formControlName="daily"
      >
    </div>

  </div>

  <!-- Bottom Row -->
  <div class="row g-3 mt-1">

    <!-- Total Budget -->
    <div class="col-md-4">
      <label class="form-label">Total Budget</label>

      <input
        type="number"
        class="form-control custom-input"
        placeholder="Enter Total Budget"
        formControlName="total"
      >
    </div>

  </div>

  <!-- Options -->
  <div class="row mt-4">

    <div class="col-md-6">
      <label class="option-card">
        <input type="checkbox" formControlName="smooth">

        <div>
          <div class="option-title">Smooth Distribution</div>
          <small>Distribute budget evenly throughout the day</small>
        </div>
      </label>
    </div>

    <div class="col-md-6">
      <label class="option-card">
        <input type="checkbox" formControlName="acceleration">

        <div>
          <div class="option-title">Acceleration</div>
          <small>Spend budget faster for more traffic</small>
        </div>
      </label>
    </div>

  </div>

</div>

    <!-- STATUS -->
    <div class="card custom-card shadow-sm border-0 mb-4">
      <div class="card-body">
        <h5>Status Settings</h5>
        <div class="row g-4">
          <!-- Status -->
          <div class="col-md-6">
            <label for="status" class="form-label custom-label"> Status </label>
            <select id="status" class="form-select custom-input" formControlName="status">
              <option value="active">Active</option>
              <option value="paused">Paused</option>
            </select>
          </div>
          <!-- Provided Clicks -->
          <div class="col-md-6" *ngxPermissionsOnly="['Admin']">
            <label for="getClicks" class="form-label custom-label"> Provided Clicks </label>
            <input (input)="onGetClicksChange($event)" id="getClicks" type="number" class="form-control custom-input" placeholder="Enter provided clicks" formControlName="getClicks">
          </div>
        </div>
      </div>
    </div>

    <!-- SUBMIT -->
    <button class="btn btn-primary w-100">
      {{ isEditMode ? 'Update Campaign' : 'Create Campaign' }}
    </button>

  </form>
</div>
